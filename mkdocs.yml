site_name: LLM serving · companion notes
site_description: A chapter-by-chapter companion to the Hands-On LLM Serving and Optimization repository — notebooks, two serving services, and the optimisation labs.
site_author: vaibhav kumar
site_url: https://vkdev01.github.io/shilp-docs-site/
repo_url: https://github.com/orca3/llm-model-inference
repo_name: orca3/llm-model-inference
edit_uri: edit/main/docs/
copyright: Notes on <a href="https://github.com/orca3/llm-model-inference">orca3/llm-model-inference</a> · MIT

theme:
  name: material
  language: en
  font:
    text: Manrope
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: kiln
      toggle:
        icon: material/weather-sunny
        name: Kiln — warm light
    - scheme: quarry
      toggle:
        icon: material/weather-partly-cloudy
        name: Quarry — cool light
    - scheme: night
      toggle:
        icon: material/weather-night
        name: Night — dark
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/shilp.css

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid.mjs

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Start here:
      - Repository tour: start/repo-tour.md
      - Benchmarks: start/benchmarks.md
  - Chapter notes:
      - "01 · Serving and optimization": chapters/01-foundations.md
      - "02 · LLM serving": chapters/02-serving.md
      - "03 · System design": chapters/03-system-design.md
      - "04 · Best practices": chapters/04-best-practices.md
      - "05 · Challenges": chapters/05-challenges.md
      - "06 · Essential techniques": chapters/06-essential.md
      - "07 · Advanced techniques": chapters/07-advanced.md
      - "08 · Frameworks": chapters/08-frameworks.md
      - "09 · In practice": chapters/09-in-practice.md
      - "10 · Advancements": chapters/10-advancements.md
  - Code walkthroughs:
      - Single-model service: walkthroughs/single-model-service.md
      - Multi-model service: walkthroughs/multi-model-service.md
      - Benchmark method: walkthroughs/benchmark-method.md
  - Plan:
      - Reading plan: plan/reading-plan.md
      - Exercises: plan/exercises.md
  - Reference:
      - Glossary: reference/glossary.md
      - Sources: reference/sources.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vkdev01
